requested_output:
  - "A verdict: valid, valid with repairs, unresolved, or false; state whether any critical objection remains before KB5 closure."
  - Authenticate every supplied body against the manifest, then reconstruct every accepted public path through preprocessing, graph selection, full fit, rank gates, deletion adjustment, four target contractions, and posted matrices, with packet line citations.
  - Re-run the six-row K(2,3) probes(2) attack under all displayed base firms and explain whether the full-firm zero-sum quotient PCG and post-solve grounding remove encoded-ID dependence for scalar and batched right-hand sides.
  - Prove or disprove that the whitening plus invariant row-anchor construction maps Z and ZT to the same numerical control basis on accepted inputs. Re-run the determinant-four map at probes(2), both nuisance conventions, and the maximum allowed tolerance.
  - Re-run positive/negative-zero, zero-plus-valid-control, frequency-two, exact/JLA, joint/fixed-offset, observation/match, and auto-dispatch rank attacks. Confirm actual omitted factor bases remain the only preprocessing removal.
  - Recheck literal-copy sufficient statistics, coefficient-one fourth moment, constrained P/M ratios, block-control projection, +B and -V signs, target normalization, total accounting, parameter metadata, failure labels, and physical-copy limit.
  - Separate critical estimator defects from conservative withholding, optional numerical hardening, documentation issues, and claims outside scope.
