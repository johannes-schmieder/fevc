id: KSS-BC-API11-FINAL-K
title: KSS API 11 quotient and canonical-control closure audit K
milestone: KB5
obligation: KB5-FINAL-PRODUCTION-CONTRACT-K
critical: true
question: >-
  Does the supplied API 11 Stata/Mata implementation satisfy the governing
  finite point-estimator contract on every accepted exact and improved-JLA
  path, including the explicit-control rank contract and fixed-seed invariance
  under firm-ID relabeling and invertible control-basis transformation?
assumptions:
  - The review is limited to finite fixed-design point estimation and numerical acceptance. It makes no sampling-inference, exact finite-R unbiasedness, uniform-asymptotic, manuscript, restricted-data, licensing, or public-release claim.
  - Positive integer frequency weights are literal physical copies. Accepted fixed-seed JLA executions must use the same conceptual sign stream after harmless row sorting, ID relabeling, and regrouping identical physical copies.
  - An invertible map Z to ZT defines the same control span. Accepted outputs must agree within the registered numerical tolerance; a typed conservative failure is allowed when the control span cannot be canonically certified at the rank margin.
  - Both nuisance conventions require an identified full worker--firm--control fit. Explicit zero or collinear numeric controls must not be silently removed. Only factor terms carrying Stata omitted metadata may be dropped.
  - "The public PCG tolerance is bounded above by 1e-4. This cap is supplementary: independently check that the full-firm quotient solve is permutation equivariant and that the canonical control basis makes adaptive inverse actions basis invariant."
  - Conservative typed withholding is permitted. False acceptance, generalized-inverse or ridge repair, silent deletion-unit or estimand changes, partial targets, stale-runtime execution, and tolerance relaxation are not.
  - Passing tests is falsification evidence only. Reconstruct production code independently, including the registered six-row K(2,3), determinant-four control map, explicit-zero, six-cycle, and literal-copy counterexamples, without using any earlier model review.
