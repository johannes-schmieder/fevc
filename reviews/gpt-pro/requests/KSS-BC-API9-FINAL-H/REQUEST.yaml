requested_output:
  - "A verdict: valid, valid with repairs, unresolved, or false; give a line-specific KB5 closure decision."
  - Reconstruct the estimator from public caller inputs through graph selection, fit, deletion adjustment, target contractions, and posted matrices.
  - Search systematically for minimal false acceptance or wrong-estimator examples involving frequency 2, R=2, singular deletions, noncommuting controls, extreme control scaling, tied components, duplicate-row splitting, batch changes, and stale Mata state.
  - Verify all coefficients, signs, normalizations, physical-copy mappings, low-dimensional factorizations, residual gates, and result labels with exact packet line references.
  - State whether each discovered issue is critical, conservative withholding, a documentation mismatch, optional hardening, or outside the authorized scope.
