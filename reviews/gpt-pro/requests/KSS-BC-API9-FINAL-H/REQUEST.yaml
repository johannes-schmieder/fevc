id: KSS-BC-API9-FINAL-H
title: KSS API 9 independent finite-counterexample audit H
milestone: KB5
obligation: KB5-FINAL-PRODUCTION-CONTRACT-H
critical: true
question: >-
  Starting from the supplied production caller and without relying on another
  model review, can any smallest finite design, probe stream, frequency split,
  control reparameterization, graph relabeling, or stale-runtime state make API
  9 accept and post KSS point estimates that violate its governing contract?
  If not, determine whether the included derivations and tests close the stated
  finite point-estimation obligations.
assumptions:
  - Review only finite point estimates and numerical acceptance. Do not infer sampling inference, uniform asymptotics, theorem transfer, public licensing, or correctness for restricted application data.
  - Literal frequency semantics require copywise finite-R observation JLA and invariance between one row with frequency f and f identical frequency-one rows under coupled signs.
  - The coefficient-one mixed raw fourth-moment formula is a candidate to verify, not an assumption.
  - A typed conservative failure is permitted even for an estimable design; false acceptance, silent estimand change, or undocumented finite-R narrowing is not.
  - Treat all packet tests as adversarial evidence only and independently inspect the production formulas they exercise.
