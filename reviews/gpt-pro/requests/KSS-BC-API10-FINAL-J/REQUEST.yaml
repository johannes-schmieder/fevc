id: KSS-BC-API10-FINAL-J
title: KSS API 10 independent minimal-counterexample audit J
milestone: KB5
obligation: KB5-FINAL-PRODUCTION-CONTRACT-J
critical: true
question: >-
  Starting only from the supplied API10 caller, Mata implementation,
  derivations, independent oracle, and tests, can any finite design or runtime
  state make the command accept and post KSS point estimates outside its stated
  contract? Search especially for variants that bypass the new invariant
  conceptual-copy order or the new all-control full-rank certificate.
assumptions:
  - Review finite point estimates and numerical acceptance only. Do not infer sampling inference, uniform asymptotics, theorem transfer, restricted-data validity, public licensing, or public release.
  - Integer frequency weights denote literal identical copies and targetweight() denotes total stored-row target mass; absent targetweight(), each copy has unit target mass.
  - Fixed-seed accepted output must be invariant under literal row splitting/regrouping, row permutation, pure worker/firm ID relabeling, and invertible control-span reparameterization. When identical ID-free primary keys conceal nonexchangeable coordinates, controls, or match blocks, fail-closed withholding is allowed.
  - Every model with controls must have an identified full worker--firm--control fit under both nuisance conventions. Numerical FE residuals may not create a nuisance dimension absent from the exact design.
  - Match headlines use the documented mover-only fit and target. Component ties have no authorized winner. A conservative typed failure is allowed; false acceptance or silent contract changes are not.
  - Treat included tests as leads rather than proof and do not use or assume any earlier model-review response.
