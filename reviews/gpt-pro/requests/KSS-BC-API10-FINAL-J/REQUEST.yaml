requested_output:
  - "A verdict: valid, valid with repairs, unresolved, or false; give a line-specific KB5 closure decision."
  - Trace the exact and JLA implementations end to end and cite packet paths and line ranges for every objection.
  - Search systematically for the smallest bypass involving frequency 2, probes 2, partial row splitting, equal primary keys, zero or negative zero, missing or extreme values, transformed controls, relabeled IDs, match labels, tied components, and stale Mata state.
  - Attack the all-control rank certificate with exactly FE-collinear, nearly collinear, rescaled, ill-conditioned multi-control, observation-deletion, match-deletion, joint, and fixed-offset designs; distinguish false acceptance from conservative rejection.
  - Verify every nonlinear coefficient, sign, normalization, residual denominator, target contraction, literal-copy mapping, low-dimensional factorization, and result label.
  - Classify each issue as a critical accepted-path defect, conservative withholding, documentation mismatch, optional hardening, or outside the authorized scope.
