requested_output:
  - "A verdict: valid, valid with repairs, unresolved, or false; state whether any critical objection remains before KB5 closure."
  - Authenticate every supplied body against the manifest, then reconstruct every accepted public path through preprocessing, graph selection, full fit, rank gates, deletion adjustment, four target contractions, final finite subtraction, and posted matrices, with packet line citations.
  - Prove or disprove that the API12 whitening and row-anchor certificate is sufficient for accepted Z and ZT inputs to produce the same numerical canonical basis at the registered tolerance. Search adversarially over score gaps, conditioning, scaling, rotations, shears, and later pivots.
  - Re-run the four-row exact-cutoff fixture and the native 14-row determinant-one witness at seed 2 across exact/JLA/auto, both nuisance conventions, two batch sizes, probes(2), and tolerance(1e-4). Distinguish valid typed withholding from basis-dependent acceptance.
  - Construct finite opposite-signed plug-in and correction rows whose subtraction overflows, trace both exact and JLA completion paths, and confirm NONFINITE_CORRECTED_TARGET occurs before any e() result is posted.
  - Re-run the six-row K(2,3) firm-relabeling attack, determinant-four map, positive/negative-zero, zero-plus-valid-control, frequency-two, six-cycle, literal-copy, and automatic-dispatch attacks.
  - Recheck literal-copy sufficient statistics, coefficient-one fourth moment, constrained P/M ratios, block-control projection, +B and -V signs, target normalization, total accounting, parameter metadata, failure labels, and physical-copy limit.
  - Separate critical estimator defects from conservative withholding, optional numerical hardening, documentation issues, and claims outside scope.

