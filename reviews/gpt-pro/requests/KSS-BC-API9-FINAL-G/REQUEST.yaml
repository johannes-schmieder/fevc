id: KSS-BC-API9-FINAL-G
title: KSS API 9 literal-copy, graph, and numerical closure audit G
milestone: KB5
obligation: KB5-FINAL-PRODUCTION-CONTRACT-G
critical: true
question: >-
  Does the supplied API 9 Stata/Mata implementation satisfy the governing
  finite point-estimator specification for exact and improved-JLA KSS
  correction, including literal coordinatewise frequency semantics at finite
  probe counts, ID-invariant fail-closed graph selection, general controls,
  all four targets, and the registered numerical gates? Identify any accepted
  production path that can return a point estimate outside that contract.
assumptions:
  - The review is limited to finite fixed-design point estimation and the unconditional random-probe law; it makes no econometric-inference, exact finite-R unbiasedness, uniform-asymptotic, or manuscript claim.
  - Positive integer frequency weights are literal physical copies. Under observation deletion the same finite-R algorithm must be applied coordinatewise to every copy; nonlinear ratios may not be pooled before copywise adjustment.
  - Conservative typed withholding is allowed. Silent deletion-unit changes, component changes, ridges, tolerance relaxation, partial targets, and stale-runtime execution are not allowed.
  - Match mode uses the documented mover-only fit and target. Ties in the registered largest-component ranking have no authorized winner and must withhold.
  - Low-dimensional controls may vary within a declared match. Joint and fixed-offset modes have the meanings in the estimator contract.
  - Passing executable tests is falsification evidence and does not prove an asymptotic theorem.
