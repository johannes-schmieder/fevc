requested_output:
  - "A verdict: valid, valid with repairs, unresolved, or false; state whether any critical objection remains before KB5 closure."
  - Trace the public command into every accepted exact and JLA formula; cite packet paths and line ranges for each objection.
  - Re-derive the API 9 per-copy sufficient statistics, constrained ratios, finite-bias and variance terms, final within-row aggregation, target scaling, and four-target accounting. Decide whether collapsed and literally expanded executions implement the same finite-R random estimator.
  - Re-derive the general match-control projection and inverse adjustment, and challenge both dense and JLA deletion-rank gates with ill-conditioned or singular finite designs.
  - Audit component-tie detection, ID relabeling, row ordering, frequency splitting, semantic runtime identity, and all fail-closed caller routes.
  - Separate critical point-estimator defects from conservative withholding, metadata hardening, exposition suggestions, and claims explicitly outside scope.
