id: KSS-BC-API10-FINAL-I
title: KSS API 10 invariant-stream and full-rank closure audit I
milestone: KB5
obligation: KB5-FINAL-PRODUCTION-CONTRACT-I
critical: true
question: >-
  Does the supplied API 10 Stata/Mata implementation satisfy the governing
  finite point-estimator contract on every accepted exact and improved-JLA
  path? In particular, do its conceptual-copy probe ordering and tie gate make
  fixed-seed output invariant to literal frequency regrouping, row order, ID
  relabeling, and invertible control reparameterization, and does every JLA
  control fit, including nuisance(fixedoffset), fail closed when the full
  worker--firm--control design is unidentified?
assumptions:
  - The review is limited to finite fixed-design point estimation and numerical acceptance. It makes no sampling-inference, exact finite-R unbiasedness, uniform-asymptotic, manuscript, restricted-data, licensing, or public-release claim.
  - Positive integer frequency weights are literal physical copies. For a fixed seed and probe count, accepted observation-JLA output must agree after splitting or regrouping identical stored rows when per-copy outcome, target mass, controls, coordinate, and deletion semantics are unchanged.
  - Accepted fixed-seed output must be invariant to row order, pure worker/firm ID relabeling, and invertible reparameterization of the same control span. A typed conservative failure is allowed where no representation-free pathwise copy order can be certified.
  - Both nuisance conventions require an identified full worker--firm--control fit. The fixed-offset convention then holds its full-sample fitted control index fixed during deletion; it may conservatively apply a stronger deletion-rank certificate.
  - Conservative typed withholding is permitted. False acceptance, generalized-inverse or ridge repair, silent deletion-unit or estimand changes, partial targets, stale-runtime execution, and tolerance relaxation are not.
  - Passing tests is falsification evidence only. Reconstruct and challenge production code independently, including the two API9 counterexample classes described by the registered regression fixtures, without relying on any prior model review.
