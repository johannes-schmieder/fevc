requested_output:
  - "A verdict: valid, valid with repairs, unresolved, or false; state whether any critical objection remains before KB5 closure."
  - Reconstruct every accepted path from public inputs through sample and graph selection, full fit, rank gates, deletion adjustment, four target contractions, and posted matrices, with packet line citations.
  - Re-run algebraically the six-copy probes(2) frequency-splitting attack, ID relabeling, control-basis transformation, and tied-key cases; decide whether accepted fixed-seed results are now pathwise representation invariant.
  - Re-run the six-cycle fixed-offset singular-control attacks at tiny scale/default tolerance and ordinary scale/loose tolerance; decide whether any approximate solve can still manufacture an accepted nuisance dimension.
  - Verify the copywise JLA sufficient statistics, coefficient-one fourth moment, constrained ratios, block-control projection, +B and -V inverse signs, target normalization, and total accounting identity.
  - Separate critical estimator defects from conservative withholding, optional numerical hardening, metadata or documentation issues, and claims outside scope.
