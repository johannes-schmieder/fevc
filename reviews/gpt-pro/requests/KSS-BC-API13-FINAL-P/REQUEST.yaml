id: KSS-BC-API13-FINAL-P
title: KSS API 13 semantic-order and numerical-certificate closure audit P
obligation: KB5-FINAL-PRODUCTION-CONTRACT-P
milestone: KB5
critical: true
question: >-
  Does the supplied API 13 Stata/Mata implementation satisfy the governing
  finite point-estimator contract on every accepted exact and improved-JLA
  path, in particular after the common semantic-order, exact-frequency,
  dimensioned control-certificate, and all-JLA allocation repairs?
assumptions:
  - The review is limited to finite fixed-design point estimation and numerical acceptance. It makes no sampling-inference, exact finite-R unbiasedness, uniform-asymptotic, manuscript, restricted-data, licensing, or public-release claim.
  - Positive integer frequency weights are literal physical copies. Accepted fixed-seed JLA executions must use the same conceptual sign stream after harmless row sorting, ID relabeling, and regrouping identical physical copies.
  - API13 withholds before graph ranking when the exact literal frequency total exceeds 2^53. Check that the incremental gate is exact and that every accepted component mass, deletion count, and N_physical value remains an exactly represented integer.
  - An invertible map Z to ZT defines the same control span. Accepted outputs must agree within the registered numerical tolerance; a typed conservative failure is allowed when the canonical anchor cannot be certified at the rank margin.
  - Audit the API13 canonical-control certificate itself. It caps the control count at 32; includes dimensioned gamma terms for Gram, Cholesky, and products; converts maximum-column inverse residuals through sqrt(k) and a positive reciprocal-conditioning denominator; includes score/cutoff, projector, anchor, and span checks; and propagates E/(r-E) through full and deletion margins with a 1e-8 ceiling. Do not assume these formulas establish the claimed accepted-path invariance.
  - Both nuisance conventions require an identified full worker--firm--control fit. Explicit zero or collinear numeric controls must not be silently removed. Only factor terms carrying Stata omitted metadata may be dropped.
  - Finite plug-in and correction rows are insufficient if their difference is nonfinite. No success path may post a missing, infinite, or partial corrected target.
  - The public PCG tolerance is bounded above by 1e-4. Independently check the full-firm quotient solve, scalar and batched permutation equivariance, canonical-control inverse actions, and recomputed residual gates.
  - Conservative typed withholding is permitted. False acceptance, generalized-inverse or ridge repair, silent deletion-unit or estimand changes, partial targets, stale-runtime execution, and tolerance relaxation are not.
  - Passing tests is falsification evidence only. Reconstruct production code independently and do not use any earlier model review or chat.
