requested_output:
  - "A verdict: valid, valid with repairs, unresolved, or false; state whether any critical objection remains before KB5 closure."
  - Authenticate every supplied body against the manifest, then reconstruct every accepted public path through preprocessing, graph selection, full fit, rank gates, deletion adjustment, four target contractions, final finite subtraction, and posted matrices, with packet line citations.
  - Prove or disprove that the API13 common semantic ordering and dimensioned canonical-control certificate are sufficient for accepted Z and ZT inputs to produce the same numerical canonical basis and downstream result at the registered tolerance. Audit every gamma term, norm conversion, perturbation denominator, pivot, final span check, and full/deletion propagation gate; search adversarially over ties, score gaps, dimensions, conditioning, scaling, rotations, shears, and later pivots.
  - Re-run the four-row cutoff, 14-row determinant-one, eight-row determinant-four, and nine-row Q versus -Q fixtures across their registered exact/JLA/auto, deletion, nuisance, relabeling, batch, probe, seed, and tolerance cases. Distinguish valid typed withholding from basis-dependent acceptance.
  - Construct finite opposite-signed plug-in and correction rows whose subtraction overflows, trace both exact and JLA completion paths, and confirm NONFINITE_CORRECTED_TARGET occurs before any e() result is posted.
  - Re-run the six-row K(2,3) firm-relabeling attack, determinant-four map, positive/negative-zero, zero-plus-valid-control, frequency-two, six-cycle, literal-copy, and automatic-dispatch attacks.
  - Recheck the two-K(2,2) L=2^52 component-mass attack, exact-total boundary, all-JLA physical-copy limit, literal-copy sufficient statistics, coefficient-one fourth moment, constrained P/M ratios, block-control projection, +B and -V signs, target normalization, total accounting, parameter metadata, and failure labels.
  - Separate critical estimator defects from conservative withholding, optional numerical hardening, documentation issues, and claims outside scope.

