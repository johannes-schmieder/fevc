id: KSS-BC-REPAIRED-C
title: KSS repaired finite-projection implementation and caller audit, independent review C
milestone: KB5
obligation: KB5-JLA-FINITE-PROJECTION / KB5-GENERAL-BLOCK-CONTROLS / KB5-PRODUCTION-CALLERS
critical: true
question: >-
  Does the repaired documentation, Mata implementation, Stata caller, and
  public-entry integration evidence consistently implement the coefficient-one
  finite-projection KSS correction for literal frequency copies and the exact
  low-dimensional-control block correction? In particular, determine whether
  the deterministic within-cell trace certificate is a valid sufficient
  certificate for full rank after every accepted deletion, and identify any
  remaining caller mismatch or finite counterexample that can falsely return a
  point estimate.
assumptions:
  - The review concerns the finite fixed-design estimator and conditional probe law documented in the packet; it makes no sampling-inference or uniform-asymptotic claim.
  - Frequency weights are positive integers representing literal physical copies, and the runtime uses the documented binomial/Rademacher aggregate rather than a fresh stored-row Rademacher.
  - The retained mover graph has passed the documented deterministic leave-one-worker connectedness checks before JLA computation.
  - Low-dimensional controls are residualized against the two-way-FE span and their Schur complement is inverted exactly, subject to the documented numerical gates.
  - Any failed graph, rank, spectral, leverage, or PCG gate aborts the entire command; no failed block or target is silently dropped.
  - Numerical and Monte Carlo tests are falsification evidence only; they do not replace algebraic verification.
sources:
  - path: kss_bc/docs/JLA_FINITE_PROJECTION.md
    note: Repaired physical-copy probe law, coefficient-one ratio expansion, pointwise order, and failed-draw scope.
  - path: kss_bc/docs/BLOCK_CONTROL_DERIVATION.md
    note: Exact FE/control block decomposition, inverse expansion, and deterministic deletion-rank certificate.
  - path: kss_bc/docs/NUMERICAL_ARCHITECTURE.md
    note: Matrix-free solver, exact control Schur complement, independent target probes, and numerical gates.
  - path: kss_bc/docs/FAILURES_AND_RETURNS.md
    note: Typed fail-closed contract and posted diagnostics.
  - path: kss_bc/kss_bc.ado
    note: Public Stata caller, input validation, Mata dispatch, result posting, and typed failures.
  - path: kss_bc/kss_bc.mata
    note: Production implementation of graph pruning, exact/JLA paths, physical-copy probes, block corrections, rank certificate, and diagnostics.
  - path: kss_bc/tests/python/test_frequency_probes.py
    note: Exhaustive literal-copy moment, match-contraction, and target-covariance checks.
  - path: kss_bc/tests/python/test_jla_formula.py
    note: Ratio expansion, fixed-seed Monte Carlo, failed-draw, and small counterexample checks.
  - path: kss_bc/tests/python/test_block_controls.py
    note: Noncommuting control-block algebra and deletion-rank certificate tests.
  - path: kss_bc/tests/python/test_package_layout.py
    note: Static production-source coefficient and harness wiring audit.
  - path: kss_bc/tests/stata/test_frequency.do
    note: Public-command frequency-copy equivalence for exact and JLA paths.
  - path: kss_bc/tests/stata/test_failures.do
    note: Public-command typed failures, including the low-probe rank-loss counterexample.
  - path: kss_bc/tests/stata/test_jla_fixture.do
    note: Public-command exact/JLA comparison and posted rank-certificate diagnostics.
requested_output:
  - "A verdict: valid, valid with repairs, unresolved, or false."
  - Trace the public caller into every production formula and report any sign, coefficient, normalization, centering, probe-independence, or matrix-order mismatch with exact file and line references.
  - Re-derive the literal physical-copy aggregation law, including its fourth moment, and verify that observation and match deletion use the correct stored-row scaling.
  - Re-derive the coefficient-one ratio expansion and check how plug-in first moments and failed finite-probe draws affect its stated order.
  - Re-derive the general block-control inverse correction, including the rank-one FE term, exact control term, spectral gates, and `+B,-V` order/signs.
  - Prove or refute that the within-cell trace test combined with the FE graph certificate is sufficient for full joint-design rank after every accepted deletion; search for a smallest counterexample and distinguish conservatism from false acceptance.
  - Check that solver residual gates and exact algebra are described with the correct logical status and that no forward-error or conditional-unbiasedness claim is smuggled in.
  - List every critical objection that must be repaired before KB5 can close, separately from optional hardening or exposition suggestions.
