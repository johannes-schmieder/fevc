version = 1
SPDX-PackageName = "FEVC"
SPDX-PackageSupplier = "Person: Johannes F. Schmieder"

[[annotations]]
path = [
    "fevc/*.ado",
    "fevc/*.mata",
    "fevc/*.sthlp",
    "fevc/*.pkg",
    "fevc/tools/**",
    "fevc/tests/**",
    "rust/Cargo.toml",
    "rust/crates/**",
    "rust/stata_backend/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Johannes F. Schmieder"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = [
    "fevc/cmg/src/**",
    "fevc/cmg/generated/**",
    "fevc/vckss_cmg.mata",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2026 Johannes F. Schmieder",
    "CMG upstream authors as recorded in fevc/cmg/docs/SOURCE_PROVENANCE.md",
]
SPDX-License-Identifier = "GPL-3.0-only"
