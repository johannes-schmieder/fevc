version = 1
SPDX-PackageName = "FEVC"
SPDX-PackageSupplier = "Person: Johannes F. Schmieder"

[[annotations]]
path = [
    "fevc/*.ado",
    "fevc/*.mata",
    "fevc/*.sthlp",
    "fevc/*.pkg",
    "fevc/tools/**",
    "fevc/tests/**",
    "rust/Cargo.toml",
    "rust/crates/**",
    "rust/stata_backend/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Johannes F. Schmieder"
SPDX-License-Identifier = "MIT"

# Code of the repeat-measurement method note and its prototype. The note, its
# addendum and the results are not covered (CODE_LICENSE.md, Other materials).
[[annotations]]
path = [
    "fevc/docs/repeat_measurement/**/*.py",
    "fevc/docs/repeat_measurement/**/*.sh",
    "fevc/docs/repeat_measurement/**/*.do",
    "fevc/docs/repeat_measurement/prototype_simulations/code/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Johannes F. Schmieder"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "fevc/cmg/src/**",
    "fevc/cmg/generated/**",
    "fevc/fevc_cmg.mata",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2026 Johannes F. Schmieder",
    "CMG upstream authors as recorded in fevc/cmg/docs/SOURCE_PROVENANCE.md",
]
SPDX-License-Identifier = "MIT"
