[package]
name = "vckss-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-3.0-only"
authors = ["Johannes Schmieder"]
repository = "https://github.com/johannes-schmieder/fevc"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vckss-plugin = { path = "../crates/vckss-plugin" }

[[bin]]
name = "request_capability"
path = "fuzz_targets/request_capability.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
