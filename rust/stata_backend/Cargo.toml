[package]
name = "vckss-stata"
version = "0.4.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Standalone Stata plugin boundary for the vckss Rust backend"
publish = false

[lib]
name = "vckss_stata"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
vckss-core = { path = "../crates/vckss-core" }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"

[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
