name: Licensed Stata CI

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Mac Stata/Rust test profile
        required: true
        type: choice
        options:
          - version
          - smoke
          - syntax
          - quick
          - mata-unit
          - full
          - plugin-build
          - plugin-load
          - numerical-small
          - differential
          - benchmark-small
        default: smoke
  push:
    branches:
      - main
      - "codex/**"
    paths-ignore:
      - ".ci/stata/latest.json"
      - ".ci/stata/results/**"

concurrency:
  group: stata-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  stata:
    name: Mac licensed / ${{ inputs.profile || 'push-selected' }}
    runs-on: [self-hosted, macOS, ARM64, stata-mp]
    timeout-minutes: 240
    outputs:
      profile: ${{ steps.finalize-receipt.outputs.profile }}
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: quick
    steps:
      - name: Check out tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve trusted test profile
        id: resolve-profile
        shell: bash
        env:
          DISPATCH_PROFILE: ${{ inputs.profile || '' }}
        run: |
          set -euo pipefail
          profile="${DISPATCH_PROFILE}"
          if [[ -z "${profile}" ]]; then
            profile=quick
            request_file=.ci/stata/requested-profile.txt
            if [[ "${GITHUB_REPOSITORY}" == johannes-schmieder/varcomp_kss && \
                  "${GITHUB_REF_NAME}" == main && \
                  -s "${request_file}" ]]; then
              profile=$(tr -d '\r\n' < "${request_file}")
            fi
          fi
          case "${profile}" in
            version|smoke|syntax|quick|mata-unit|full|plugin-build|plugin-load|numerical-small|differential|benchmark-small) ;;
            *) echo "invalid Licensed Stata CI profile: ${profile}" >&2; exit 2 ;;
          esac
          printf 'profile=%s\n' "${profile}" >> "${GITHUB_OUTPUT}"
          printf 'STATA_PROFILE=%s\n' "${profile}" >> "${GITHUB_ENV}"

      - name: Test receipt machinery
        id: receipt-tests
        run: /usr/bin/python3 -m unittest discover -s ci/tests -p 'test_*.py'

      - name: Run licensed Mac profile
        id: licensed-profile
        run: ./ci/run_ci_profile.sh "$STATA_PROFILE"

      - name: Run quick Rust checks on normal pushes
        id: rust-quick
        if: ${{ always() && github.event_name == 'push' }}
        run: ./ci/run_rust_quick.sh

      - name: Finalize exact-SHA receipt
        id: finalize-receipt
        if: always()
        shell: bash
        env:
          RESOLVED_PROFILE: ${{ steps.resolve-profile.outputs.profile || 'quick' }}
          RESOLVE_PROFILE_OUTCOME: ${{ steps.resolve-profile.outcome }}
          RECEIPT_TESTS_OUTCOME: ${{ steps.receipt-tests.outcome }}
          LICENSED_PROFILE_OUTCOME: ${{ steps.licensed-profile.outcome }}
          RUST_QUICK_OUTCOME: ${{ steps.rust-quick.outcome }}
          RUST_QUICK_REQUIRED: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          profile="${RESOLVED_PROFILE:-quick}"
          arguments=(
            --receipt .ci/stata/run/receipt.json
            --profile-config ci/stata_profiles.json
            --profile "${profile}"
            --tested-sha "${GITHUB_SHA}"
            --repository "${GITHUB_REPOSITORY}"
            --ref "${GITHUB_REF}"
            --run-id "${GITHUB_RUN_ID}"
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
            --runner-name "${RUNNER_NAME}"
            --stata-executable "${STATA_BIN}"
            --resolve-profile-outcome "${RESOLVE_PROFILE_OUTCOME}"
            --receipt-tests-outcome "${RECEIPT_TESTS_OUTCOME}"
            --licensed-profile-outcome "${LICENSED_PROFILE_OUTCOME}"
            --rust-quick-outcome "${RUST_QUICK_OUTCOME}"
          )
          if [[ "${RUST_QUICK_REQUIRED}" == true ]]; then
            arguments+=(--rust-quick-required)
          fi
          /usr/bin/python3 ci/finalize_stata_receipt.py "${arguments[@]}"
          printf 'profile=%s\n' "${profile}" >> "${GITHUB_OUTPUT}"

      - name: Upload Mac CI logs and receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/stata/run/
          if-no-files-found: error
          retention-days: 30

  publish-receipt:
    name: Publish exact-SHA receipt
    needs: stata
    if: ${{ always() && needs.stata.result != 'cancelled' }}
    runs-on: [self-hosted, macOS, ARM64, stata-mp]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out receipt publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download Stata receipt
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: stata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stata-receipt

      - name: Validate receipt identity
        run: >-
          /usr/bin/python3 ci/check_stata_receipt.py
          "$RUNNER_TEMP/stata-receipt/receipt.json"
          --expect-tested-sha "$GITHUB_SHA"
          --expect-profile "$STATA_PROFILE"
        env:
          STATA_PROFILE: ${{ needs.stata.outputs.profile }}

      - name: Commit per-SHA receipt and guarded latest pointer
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/stata-receipt/receipt.json
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          result_path=".ci/stata/results/$GITHUB_SHA.json"
          publish_tree=""

          cleanup_publish_tree() {
            if [[ -n "$publish_tree" ]]; then
              cd "$GITHUB_WORKSPACE"
              git worktree remove --force "$publish_tree" 2>/dev/null || true
              git worktree prune
              publish_tree=""
            fi
          }
          trap cleanup_publish_tree EXIT

          for attempt in 1 2 3; do
            git fetch origin "$branch"
            publish_tree="$RUNNER_TEMP/stata-publish-$attempt"
            git worktree add --detach "$publish_tree" "origin/$branch"
            cd "$publish_tree"

            mkdir -p .ci/stata/results
            cp "$RECEIPT" "$result_path"

            if git merge-base --is-ancestor "$GITHUB_SHA" HEAD &&
               git diff --quiet "$GITHUB_SHA..HEAD" -- . \
                 ':(exclude).ci/stata/results/**' \
                 ':(exclude).ci/stata/latest.json'; then
              cp "$RECEIPT" .ci/stata/latest.json
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$result_path" .ci/stata/latest.json 2>/dev/null || git add "$result_path"

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "ci(stata): record ${GITHUB_SHA:0:12} [skip ci]"
            if git push origin "HEAD:refs/heads/$branch"; then
              exit 0
            fi

            cleanup_publish_tree
          done

          echo "receipt publication lost three branch update races" >&2
          exit 1

  apply-trusted-patch:
    name: Apply staged trusted patch
    needs: [stata, publish-receipt]
    if: >-
      ${{ always() &&
          github.event_name == 'push' &&
          needs.stata.result == 'success' &&
          needs.publish-receipt.result == 'success' &&
          github.repository == 'johannes-schmieder/varcomp_kss' &&
          github.ref_name == 'main' &&
          github.actor != 'github-actions[bot]' }}
    runs-on: [self-hosted, macOS, ARM64, stata, stata-mp, stata18]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Apply staged repository transformation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = johannes-schmieder/varcomp_kss
          test "${GITHUB_REF_NAME}" = main
          if [[ ! -s .ci/codex/apply.py && ! -s .ci/codex/apply.patch ]]; then
            echo "no staged trusted transformation"
            exit 0
          fi
          test -s .ci/codex/commit-message.txt
          commit_message=$(cat .ci/codex/commit-message.txt)
          test -n "${commit_message}"

          output_file=$(mktemp)
          set +e
          if [[ -s .ci/codex/apply.py ]]; then
            /usr/bin/python3 .ci/codex/apply.py >"${output_file}" 2>&1
            apply_rc=$?
          else
            git apply --check .ci/codex/apply.patch >"${output_file}" 2>&1
            apply_rc=$?
            if [[ ${apply_rc} -eq 0 ]]; then
              git apply .ci/codex/apply.patch >>"${output_file}" 2>&1
              apply_rc=$?
            fi
          fi
          set -e
          cat "${output_file}"
          if [[ ${apply_rc} -ne 0 ]]; then
            exit "${apply_rc}"
          fi

          rm -f .ci/codex/apply.py .ci/codex/apply.patch \
            .ci/codex/commit-message.txt .ci/codex/last-apply.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "trusted transformation produced no changes" >&2
            exit 1
          fi
          git commit -m "${commit_message}"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && \
               git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep "${attempt}"
          done
          exit 1
