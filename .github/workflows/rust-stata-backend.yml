name: Rust Stata backend

on:
  push:
    branches:
      - main
      - codex/rust-backend-implementation
    paths:
      - "rust/crates/vckss-core/**"
      - "rust/crates/vckss-plugin/src/context.rs"
      - "rust/crates/vckss-plugin/src/context_ffi.rs"
      - "rust/crates/vckss-plugin/src/session.rs"
      - "rust/crates/vckss-plugin/src/ffi_session.rs"
      - "rust/stata_backend/**"
      - ".github/workflows/rust-stata-backend.yml"
  pull_request:
    paths:
      - "rust/crates/vckss-core/**"
      - "rust/crates/vckss-plugin/src/context.rs"
      - "rust/crates/vckss-plugin/src/context_ffi.rs"
      - "rust/crates/vckss-plugin/src/session.rs"
      - "rust/crates/vckss-plugin/src/ffi_session.rs"
      - "rust/stata_backend/**"
      - ".github/workflows/rust-stata-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-stata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [1.81.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust/stata_backend/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/stata_backend/Cargo.toml --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path rust/stata_backend/Cargo.toml --locked --all-targets
      - name: Release build
        run: cargo build --manifest-path rust/stata_backend/Cargo.toml --locked --release

  linux-rust-abi:
    name: Linux x86-64 Rust ABI artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.81.0
      - run: cargo build --manifest-path rust/stata_backend/Cargo.toml --locked --release
      - name: Inspect and stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ldd rust/stata_backend/target/release/libvckss_stata.so
          cp rust/stata_backend/target/release/libvckss_stata.so \
             artifacts/vckss_stata_rust_abi_linux_x64.so
          sha256sum artifacts/vckss_stata_rust_abi_linux_x64.so \
             > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vckss-stata-rust-abi-linux-x64
          path: artifacts/
          if-no-files-found: error

  windows-rust-abi:
    name: Windows x86-64 Rust ABI artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.81.0
      - run: cargo build --manifest-path rust/stata_backend/Cargo.toml --locked --release
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item rust/stata_backend/target/release/vckss_stata.dll `
            artifacts/vckss_stata_rust_abi_windows_x64.dll
          $hash = (Get-FileHash artifacts/vckss_stata_rust_abi_windows_x64.dll -Algorithm SHA256).Hash.ToLower()
          "$hash  vckss_stata_rust_abi_windows_x64.dll" | Set-Content -Encoding ascii artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vckss-stata-rust-abi-windows-x64
          path: artifacts/
          if-no-files-found: error

  macos-universal-rust-abi:
    name: macOS universal Rust ABI artifact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.81.0
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build both architecture slices
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/stata_backend/Cargo.toml --locked --release \
            --target x86_64-apple-darwin
          cargo build --manifest-path rust/stata_backend/Cargo.toml --locked --release \
            --target aarch64-apple-darwin
      - name: Create and inspect universal artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          lipo -create \
            rust/stata_backend/target/x86_64-apple-darwin/release/libvckss_stata.dylib \
            rust/stata_backend/target/aarch64-apple-darwin/release/libvckss_stata.dylib \
            -output artifacts/vckss_stata_rust_abi_macos_universal.dylib
          lipo -info artifacts/vckss_stata_rust_abi_macos_universal.dylib
          shasum -a 256 artifacts/vckss_stata_rust_abi_macos_universal.dylib \
            > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vckss-stata-rust-abi-macos-universal
          path: artifacts/
          if-no-files-found: error
