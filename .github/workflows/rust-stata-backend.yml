name: Rust Stata SDK boundary

on:
  push:
    branches:
      - main
    paths:
      - "rust/crates/vckss-core/Cargo.toml"
      - "rust/stata_backend/**"
      - ".github/workflows/rust-stata-backend.yml"
  pull_request:
    paths:
      - "rust/crates/vckss-core/Cargo.toml"
      - "rust/stata_backend/**"
      - ".github/workflows/rust-stata-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-stata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  source-boundary:
    name: SDK boundary / ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [1.81.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Check build-boundary formatting
        run: rustfmt --edition 2021 --check rust/stata_backend/build.rs
      - name: Check locked standalone metadata
        run: cargo metadata --manifest-path rust/stata_backend/Cargo.toml --locked --format-version 1
      - name: Test the SDK preflight without SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          test_binary="${RUNNER_TEMP}/vckss-build-boundary-tests"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            test_binary="${test_binary}.exe"
          fi
          rustc --edition=2021 -D warnings --test rust/stata_backend/build.rs -o "${test_binary}"
          "${test_binary}"
      - name: Confirm an SDK-free plugin build fails closed
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == '1.81.0'
        shell: bash
        run: |
          set -euo pipefail
          unset VCKSS_STATA_SDK_DIR
          output="${RUNNER_TEMP}/vckss-sdk-preflight.txt"
          if cargo check --manifest-path rust/stata_backend/Cargo.toml --locked >"${output}" 2>&1; then
            echo "SDK-free standalone build unexpectedly succeeded"
            exit 1
          fi
          grep -F "set VCKSS_STATA_SDK_DIR" "${output}"

# Authentic Stata SDK inputs are licensed external resources and are not
# provisioned by this repository. Cross-platform plugin builds and artifact
# publication must remain disabled until a controlled workflow supplies an
# explicit VCKSS_STATA_SDK_DIR containing stplugin.c and stplugin.h.
