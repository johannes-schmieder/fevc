name: Codex Apply Trusted Patch

on:
  push:
    branches:
      - main
    paths:
      - .ci/codex/apply.py
      - .ci/codex/apply.patch

permissions:
  contents: write

concurrency:
  group: codex-apply-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'johannes-schmieder/fevc' &&
      github.ref_name == 'main' &&
      github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, macOS, ARM64, stata, stata-mp, stata18]
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Apply staged repository transformation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = johannes-schmieder/fevc
          test "${GITHUB_REF_NAME}" = main
          test -s .ci/codex/commit-message.txt
          commit_message=$(cat .ci/codex/commit-message.txt)
          test -n "${commit_message}"

          output_file=$(mktemp)
          set +e
          if [[ -s .ci/codex/apply.py ]]; then
            /usr/bin/python3 .ci/codex/apply.py >"${output_file}" 2>&1
            apply_rc=$?
          elif [[ -s .ci/codex/apply.patch ]]; then
            git apply --check .ci/codex/apply.patch >"${output_file}" 2>&1 && \
              git apply .ci/codex/apply.patch >>"${output_file}" 2>&1
            apply_rc=$?
          else
            printf '%s\n' 'no staged transformation found' >"${output_file}"
            apply_rc=2
          fi
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ ${apply_rc} -ne 0 ]]; then
            mkdir -p .ci/codex
            /usr/bin/python3 - "${apply_rc}" "${output_file}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          rc = int(sys.argv[1])
          detail = Path(sys.argv[2]).read_text(encoding="utf-8", errors="replace")[-4000:]
          payload = {
              "schema_version": 1,
              "trigger_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "status": "failure",
              "process_rc": rc,
              "detail": detail,
          }
          Path(".ci/codex/last-apply.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            git add .ci/codex/last-apply.json
            git commit -m "ci(codex): record failed transformation [skip ci]" || true
          else
            rm -f .ci/codex/apply.py .ci/codex/apply.patch \
              .ci/codex/commit-message.txt .ci/codex/last-apply.json
            git add -A
            if git diff --cached --quiet; then
              echo "trusted transformation produced no changes" >&2
              exit 1
            fi
            git commit -m "${commit_message}"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && \
               git push origin HEAD:main; then
              [[ ${apply_rc} -eq 0 ]]
              exit $?
            fi
            git rebase --abort || true
            sleep "${attempt}"
          done
          exit 1
