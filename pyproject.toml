[project]
name = "fevc-research"
version = "0.5.0rc1"
description = "Stata/Mata fevc package with an internal CMG component"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = [
  "fevc/tests/python",
  "fevc/cmg/tests",
  "fevc/benchmarks/matlab_scale/tests",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
