[project]
name = "varcomp-kss-research"
version = "0.3.0.dev0"
description = "Stata/Mata varcomp_kss package with an internal CMG component"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = [
  "varcomp_kss/tests/python",
  "varcomp_kss/cmg/tests",
  "varcomp_kss/benchmarks/matlab_scale/tests",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
