[project]
name = "varcomp-kss-research"
version = "0.2.0.dev0"
description = "Stata/Mata KSS leave-out variance-component implementation and CMG infrastructure"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = [
  "kss_bc/tests/python",
  "shared/cmg/tests",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
